name: Publish

on:
  release:
    types: [released, prereleased]
  workflow_dispatch:

jobs:
  docc:
    name: Generate and publish documentation
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Generate documentation
        run: |
          swift package --allow-writing-to-directory ./docs \
            generate-documentation \
            --enable-experimental-combined-documentation \
            --target StoryblokClient \
            --target RichTextView \
            --target URLSessionExtension \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path storyblok-swift \
            --output-path ./docs

      - name: Update favicon
        run: |
          cp -f images/favicon.svg docs/favicon.svg
          cp -f images/favicon.ico docs/favicon.ico

      - name: Deploy API documentation to Github Pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: docs
          target-folder: docs
